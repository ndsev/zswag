name: Build and Deploy

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to build a snapshot from
        default: main
        required: true
      release_notes:
        description: Optional notes for this snapshot release
        required: false

jobs:
  determine-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.ref }}
          fetch-depth: 0
          fetch-tags: true
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: pip install setuptools_scm packaging
      
      - name: Get version
        id: version
        run: |
          python .github/scripts/determine_version.py \
            --event "${{ github.event_name }}" \
            --ref "${{ github.event.inputs.ref || github.ref_name }}"

  build-manylinux:
    needs: [determine-version]
    strategy:
      matrix:
        python-version: ["3.11"]
        arch: ["x86_64", "aarch64"]
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    container: ghcr.io/klebert-engineering/manylinux-cpp17-py${{ matrix.python-version }}-${{ matrix.arch }}:2025.1
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
      SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.determine-version.outputs.version }}
    steps:
      - name: Which Node.js?
        run: |
          echo "Node at $(which node): $(node -v); npm: $(npm -v)"
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.ref }}
          submodules: recursive
      - name: Configure
        run: |
          python3 -m venv venv && . ./venv/bin/activate
          # The manylinux image still ships auditwheel 6.4.0, which falsely
          # rejects this wheel as having too-recent symbols. Use a newer
          # auditwheel from the venv for the repair step.
          pip install -U setuptools wheel pip delocate auditwheel "h2>=4.1,<5"
          mkdir build && cd build && cmake -DCMAKE_BUILD_TYPE=Release -DZSWAG_ENABLE_TESTING=ON -DZSWAG_VERSION="${{ needs.determine-version.outputs.version }}" ..
      - name: Build
        working-directory: build
        run: |
          export LD_LIBRARY_PATH=$(pwd)/bin:${LD_LIBRARY_PATH}
          . ../venv/bin/activate
          cmake --build .
          mv bin/wheel bin/wheel-auditme
          mkdir bin/wheel
          auditwheel repair bin/wheel-auditme/zswag*.whl -w bin/wheel
      - name: Test
        working-directory: build
        run: |
          . ../venv/bin/activate
          ctest -C Release --verbose --no-tests=error
      - name: Test OAuth Authentication
        working-directory: build
        run: |
          . ../venv/bin/activate
          pip install bin/wheel/zswag-*.whl
          python ../libs/zswag/test/oauth2_mock/test_oauth_e2e.py
      - name: Deploy
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.arch }}-py${{ matrix.python-version }}
          path: build/bin/wheel/*.whl
  
  build:
    needs: [determine-version]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # macos-15: Apple Silicon runners (arm64)
        os: [macos-15, macos-15-intel, windows-latest]
        python-version: ["3.11"]
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.determine-version.outputs.version }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.ref }}
        submodules: recursive
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        architecture: ${{ matrix.os == 'macos-15' && 'arm64' || 'x64' }}
    - run: python -m pip install setuptools wheel
    - run: mkdir build
    - name: Build (macOS)
      if: startsWith(matrix.os, 'macos')
      working-directory: build
      run: |
        export MACOSX_DEPLOYMENT_TARGET=11.0
        export _PYTHON_HOST_PLATFORM="macosx-11.0-$(uname -m)"
        python -m pip install delocate "h2>=4.1,<5"
        cmake -DCMAKE_OSX_ARCHITECTURES="$(uname -m)" -DPython3_ROOT_DIR=$pythonLocation \
              -DPython3_FIND_FRAMEWORK=LAST \
              -DCMAKE_BUILD_TYPE=Release \
              -DHTTPLIB_USE_BROTLI_IF_AVAILABLE=OFF \
              -DZSWAG_ENABLE_TESTING=ON \
              -DZSWAG_VERSION=${{ needs.determine-version.outputs.version }} ..
        cmake --build .
        # No wheel repair needed with python-cmake-wheel commit b1d399e
        mv bin/wheel bin/wheel-final
        mkdir bin/wheel
        mv bin/wheel-final/zswag*.whl bin/wheel/
    - name: Build (Windows)
      if: startsWith(matrix.os, 'windows')
      working-directory: build
      run: |
        # Install NASM and jom using chocolatey (required for OpenSSL build)
        choco install nasm jom -y
        # Add NASM to PATH for current session
        $env:PATH = "$env:PATH;C:\Program Files\NASM"
        # Verify NASM installation
        nasm -v
        # Install delvewheel for bundling DLLs into wheel
        pip install delvewheel "h2>=4.1,<5"
        echo "cmake -DPython3_ROOT_DIR=$env:pythonLocation"
        cmake "-DPython3_ROOT_DIR=$env:pythonLocation" -DPython3_FIND_REGISTRY=LAST -DCMAKE_BUILD_TYPE=Release -DZSWAG_ENABLE_TESTING=ON -DZSWAG_VERSION="${{ needs.determine-version.outputs.version }}" ..
        cmake --build . --config Release
        # Bundle DLLs into wheel using delvewheel (like auditwheel on Linux)
        Rename-Item -Path bin/wheel -NewName wheel-auditme
        New-Item -ItemType Directory -Path bin/wheel
        delvewheel repair --add-path bin/Release (Get-Item bin/wheel-auditme/zswag*.whl) -w bin/wheel
    - name: Deploy
      uses: actions/upload-artifact@v4
      with:
        name: wheels-${{ matrix.os }}-py${{ matrix.python-version }}
        path: build/bin/wheel/*.whl
    - name: Test
      working-directory: build
      run: |
        ctest -C Release --verbose --no-tests=error
    - name: Test OAuth Authentication
      working-directory: build
      shell: bash  # Use bash on all platforms for consistent wildcard expansion
      env:
        PYTHONIOENCODING: utf-8
      run: |
        pip install bin/wheel/zswag-*.whl
        python ../libs/zswag/test/oauth2_mock/test_oauth_e2e.py

  test-shared-wheel:
    name: Install the same Linux wheel on CPython ${{ matrix.python-version }}
    needs: [determine-version, build-manylinux]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          name: wheels-linux-x86_64-py3.11
          path: dist
      - name: Audit the stable Python ABI
        if: matrix.python-version == '3.14'
        run: |
          python -m pip install --only-binary=:all: abi3audit==0.0.26
          abi3audit --strict dist/*.whl
      - name: Install and exercise the repaired stable-ABI wheel
        env:
          WHEEL_VERSION: ${{ needs.determine-version.outputs.version }}
        run: |
          test -f dist/zswag-*-cp310-abi3-*.whl
          # Select only the artifact from this run, even if its version is on PyPI.
          python -m pip install --only-binary=:all: --no-index --find-links dist --no-deps "zswag==$WHEEL_VERSION"
          python -m pip install --only-binary=:all: "zswag==$WHEEL_VERSION"
          python -m pip check
          python libs/zswag/test/split-wheel-smoke.py

  deploy:
    needs: [determine-version, build-manylinux, build, test-shared-wheel]
    if: |
      success() && 
      github.event_name == 'push' && 
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install setuptools wheel setuptools_scm twine
      
      - name: Validate version
        run: |
          python .github/scripts/validate_version.py
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true
      
      - name: List wheels
        run: |
          echo "Downloaded wheels:"
          ls -la dist/
          echo "Wheel details:"
          ls dist/*.whl
      
      - name: Upload to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.KE_PYPI_TOKEN }}
        run: |
          # For main branch, upload to TestPyPI first (optional)
          # For tags, upload to PyPI
          if [[ "${{ github.ref }}" == "refs/heads/main" || "${{ github.ref }}" == "refs/heads/master" ]]; then
            echo "Uploading development version to PyPI..."
          else
            echo "Uploading release version to PyPI..."
          fi
          
          twine upload \
            --non-interactive \
            --skip-existing \
            --verbose \
            dist/*

  manual-snapshot:
    needs: [determine-version, build-manylinux, build]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.determine-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install setuptools wheel setuptools_scm

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true

      - name: Create release tag name
        id: release_info
        run: |
          # Sanitize branch name for release tag
          REF_NAME="${{ github.event.inputs.ref }}"
          SLUG=$(echo "$REF_NAME" | sed 's/[^A-Za-z0-9]/-/g' | sed 's/^-*//' | sed 's/-*$//' | tr '[:upper:]' '[:lower:]')
          if [ -z "$SLUG" ]; then
            SLUG="snapshot"
          fi
          SHORT_SHA=$(git rev-parse --short HEAD)
          RELEASE_TAG="snapshot-${SLUG}-${SHORT_SHA}"
          echo "release_tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Create GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT_REF: ${{ github.event.inputs.ref }}
          VERSION: ${{ needs.determine-version.outputs.version }}
          RELEASE_TAG: ${{ steps.release_info.outputs.release_tag }}
          SHORT_SHA: ${{ steps.release_info.outputs.short_sha }}
          CUSTOM_NOTES: ${{ github.event.inputs.release_notes }}
        run: |
          repo_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          shopt -s failglob
          {
            printf '## Test snapshot from %s\n\n' "$SNAPSHOT_REF"
            printf '**Version:** `%s`\n**Commit:** `%s`\n' "$VERSION" "$SHORT_SHA"
            printf '**Build:** [%s](%s/actions/runs/%s)\n\n' "$GITHUB_RUN_ID" "$repo_url" "$GITHUB_RUN_ID"
            printf '%s\n\n' 'In a fresh CPython 3.10 through 3.14 virtual environment, run only the command for your OS and CPU. Pip installs the matching nanobind backend automatically.'
            for wheel in dist/*.whl; do
              printf -- '- `python -m pip install "%s/releases/download/%s/%s"`\n' "$repo_url" "$RELEASE_TAG" "${wheel##*/}"
            done
            if [ -n "$CUSTOM_NOTES" ]; then
              printf '\n### Release notes\n\n%s\n' "$CUSTOM_NOTES"
            fi
          } > release_notes.md

          gh release create "$RELEASE_TAG" \
            --prerelease \
            --target "$SNAPSHOT_REF" \
            --title "Test Snapshot: $SNAPSHOT_REF ($SHORT_SHA)" \
            --notes-file release_notes.md \
            dist/*
